name: dms

services:
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    ports:
      - "3000:3000"
      - "9005:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api-gateway/src:/usr/src/app/src
    env_file: .env
    depends_on:
      - auth-service
      - super-admin-service
      - tenant-service
      - user-service
      - email-service
      - manager-service
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    expose:
      - "3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./auth-service/src:/usr/src/app/src
      - ./shared:/usr/src/app/src/shared
    env_file: .env
    restart: unless-stopped

  super-admin-service:
    build:
      context: .
      dockerfile: ./super-admin-service/Dockerfile
    expose:
      - "3001"
    env_file: .env
    restart: unless-stopped

  tenant-service:
    build:
      context: .
      dockerfile: ./tenant-service/Dockerfile
    expose:
      - "3003"
    volumes:
      - ./tenant-service/src:/usr/src/app/src
      - ./shared:/usr/src/app/src/shared
    env_file: .env
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    expose:
      - "3004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./user-service/src:/usr/src/app/src
      - ./shared:/usr/src/app/src/shared
    env_file: .env
    restart: unless-stopped

  email-service:
    build:
      context: .
      dockerfile: ./email-service/Dockerfile
    expose:
      - "3005"
    env_file: .env
    restart: unless-stopped

  manager-service:
    build:
      context: .
      dockerfile: ./manager-service/Dockerfile
    expose:
      - "3006"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    volumes:
      - ./manager-service/src:/usr/src/app/src
      - ./shared:/usr/src/app/src/shared
      - manager-uploads:/usr/src/app/uploads
    restart: unless-stopped

  viewer-service:
    build:
      context: .
      dockerfile: ./viewer-service/Dockerfile
    expose:
      - "3007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    volumes:
      - ./viewer-service/src:/usr/src/app/src
      - ./shared:/usr/src/app/src/shared
      - manager-uploads:/usr/src/app/uploads
    restart: unless-stopped

volumes:
  manager-uploads:
