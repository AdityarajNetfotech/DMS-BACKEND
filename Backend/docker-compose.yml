services:
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-9005}:3000"
    env_file: .env
    depends_on:
      - auth-service
      - super-admin-service
      - tenant-service
      - user-service
      - email-service
      - manager-service
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    expose:
      - "3002"
    env_file: .env
    restart: unless-stopped

  super-admin-service:
    build:
      context: .
      dockerfile: ./super-admin-service/Dockerfile
    expose:
      - "3001"
    env_file: .env
    restart: unless-stopped

  tenant-service:
    build:
      context: .
      dockerfile: ./tenant-service/Dockerfile
    expose:
      - "3003"
    env_file: .env
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    expose:
      - "3004"
    env_file: .env
    restart: unless-stopped

  email-service:
    build:
      context: .
      dockerfile: ./email-service/Dockerfile
    expose:
      - "3005"
    env_file: .env
    restart: unless-stopped

  manager-service:
    build:
      context: .
      dockerfile: ./manager-service/Dockerfile
    expose:
      - "3006"
    env_file: .env
    volumes:
      - manager-uploads:/usr/src/app/uploads
    restart: unless-stopped

  viewer-service:
    build:
      context: .
      dockerfile: ./viewer-service/Dockerfile
    expose:
      - "3007"
    env_file: .env
    volumes:
      - manager-uploads:/usr/src/app/uploads
    restart: unless-stopped

volumes:
  manager-uploads:
